name: Build Nokia XG-040G-TF Auto-Sync

on:
  workflow_dispatch: # 支持手动点击触发
  push:
    paths:
      - '.config' # 修改 .config 自动触发
  schedule:
    - cron: '0 20 * * 5' # 每周五 20:00 UTC 触发 (北京时间周六早上 4:00)，实现上游自动同步更新

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 确保能发布到 Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools rsync subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xxd zlib1g-dev zstd

      - name: Clone PONWrt Upstream & Custom Packages
        run: |
          # 1. 克隆上游源码
          git clone --depth 1 https://github.com/pbs05/ponwrt.git openwrt
          cd openwrt

          # 2. 正常更新并安装官方基础 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 3. 直接克隆到 package 原生目录，避免 feeds 索引缺失
          git clone --depth 1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu

          # 4. 关键：解除 Makefile 中的架构限制（防止 defconfig 将其当作不兼容平台剔除）
          sed -i 's/DEPENDS:=+.*@TARGET_.*/DEPENDS:=+luci-base/g' package/luci-app-airoha-npu/Makefile 2>/dev/null || true

          # 5. 清理包信息缓存，强迫系统全盘重新建立包关系索引
          rm -rf tmp/

      - name: Apply Configuration & Validate NPU
        run: |
          cd openwrt
          # 导入基础配置
          cp ../.config .config

          # 强行锁定核心功能与依赖驱动
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci-app-airoha-npu=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-i18n-cpufreq-zh-cn=y
          CONFIG_KERNEL_DEVMEM=y
          CONFIG_BUSYBOX_CONFIG_DEVMEM=y
          CONFIG_PACKAGE_kmod-cpufreq-governor=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_lm-sensors=y
          EOF

          # 生成最终依赖树
          make defconfig

          # 核心校验：输出检查结果
          echo "=========================================="
          echo "检查核心配置状态："
          grep -E "CONFIG_PACKAGE_luci-app-airoha-npu|CONFIG_PACKAGE_luci-app-cpufreq|CONFIG_KERNEL_DEVMEM" .config || echo "CRITICAL: NPU 配置依然丢失！"
          echo "=========================================="

      - name: Download Package Sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f
