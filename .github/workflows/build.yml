name: Build Nokia XG-040G-TF Auto-Sync

on:
  workflow_dispatch: # 支持手动点击触发
  push:
    paths:
      - '.config' # 修改 .config 自动触发
  schedule:
    - cron: '0 20 * * 5' # 每周五 20:00 UTC 触发 (北京时间周六早上 4:00)，实现上游自动同步更新

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 确保能发布到 Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools rsync subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xxd zlib1g-dev zstd

      - name: Clone PONWrt Upstream & Custom Packages
        run: |
          # 1. 克隆上游源码
          git clone --depth 1 https://github.com/pbs05/ponwrt.git openwrt
          cd openwrt

          # 2. 准备本地自定义 Feed 仓库
          mkdir -p custom-feeds
          git clone --depth 1 https://github.com/rchen14b/luci-app-airoha-npu.git custom-feeds/luci-app-airoha-npu

          # 3. 将本地目录以最高优先级注册为官方 feed 源
          echo "src-link custom $(pwd)/custom-feeds" >> feeds.conf.default

          # 4. 更新并安装所有 feeds（此时 custom 插件会被完整注册进全局索引）
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Configuration & Validate NPU
        run: |
          cd openwrt
          # 导入基础配置
          cp ../.config .config

          # 自动解析 Makefile 内声明的真实包名，防止包名大小写或下划线不匹配
          PKG_NAME=$(grep -oE "Package/luci-app-[a-zA-Z0-9_-]+" custom-feeds/luci-app-airoha-npu/Makefile | head -n 1 | cut -d/ -f2)
          [ -z "$PKG_NAME" ] && PKG_NAME="luci-app-airoha-npu"
          echo ">>> 提取到 NPU 插件真实包名: $PKG_NAME"

          # 强行锁定核心功能与依赖驱动
          cat << EOF >> .config
          CONFIG_PACKAGE_${PKG_NAME}=y
          CONFIG_KERNEL_DEVMEM=y
          CONFIG_BUSYBOX_CONFIG_DEVMEM=y
          CONFIG_PACKAGE_kmod-cpufreq-governor=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_lm-sensors=y
          EOF

          # 生成最终依赖树
          make defconfig

          # 核心校验：输出检查结果
          echo "=========================================="
          echo "检查核心配置状态："
          grep -E "CONFIG_PACKAGE_luci-app.*npu|CONFIG_KERNEL_DEVMEM" .config || echo "CRITICAL: NPU 配置依然丢失！"
          echo "=========================================="

      - name: Download Package Sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Starting compilation with $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cd openwrt/bin/targets/airoha/an7581
          # 收集固件镜像与校验单
          cp *xg-040g-tf* $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          # 递归收集编译出的所有 luci 插件独立 ipk/apk 包（作为双重备份）
          find $GITHUB_WORKSPACE/openwrt/bin/ -name "*airoha*.ipk" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          find $GITHUB_WORKSPACE/openwrt/bin/ -name "*airoha*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/output/

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=AutoBuild-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "release_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "XG-040G-TF 全能固件 [${{ env.release_date }}]"
          body: |
            ### 固件说明
            * **机型**: Nokia XG-040G-TF (达发 AN7581)
            * **上游源码**: 同步至 `pbs05/ponwrt` 最新主分支
            * **核心特性**: 达发 AN7581 NPU (PPE) 硬件加速、CPU 实时频率与温度监控面板、动态节能调频支持
            * **刷机说明**: 
              * 原厂 U-Boot 网页初次刷入请选 `...factory.itb`
              * 系统内后台升级请选 `...sysupgrade.itb`
          files: output/*
