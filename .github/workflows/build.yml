name: Build Pure Nokia XG-040G

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions: write-all

jobs:
  check-and-build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 检查上游源码更新
        id: check
        run: |
          UPSTREAM_HASH=$(curl -s "https://api.github.com/repos/pbs05/ponwrt/commits/master" | jq -r .sha)
          echo "上游最新 Commit Hash: $UPSTREAM_HASH"
          
          LOCAL_HASH=""
          if [ -f .upstream_hash ]; then
            LOCAL_HASH=$(cat .upstream_hash)
          fi
          echo "本地上次 Commit Hash: $LOCAL_HASH"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$UPSTREAM_HASH" != "$LOCAL_HASH" ]; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
            if [ -n "$UPSTREAM_HASH" ] && [ "$UPSTREAM_HASH" != "null" ]; then
              echo "$UPSTREAM_HASH" > .upstream_hash
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git add .upstream_hash
              git commit -m "chore: 更新上游追踪 Hash 至 $UPSTREAM_HASH" || true
              git push || true
            fi
          else
            echo "上游源码没有更新，本次跳过编译。"
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: 释放空间并挂载 Swap 虚拟内存
        if: steps.check.outputs.build_needed == 'true'
        run: |
          echo "=== 1. 清理无用预装环境 ==="
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          df -hT

          echo "=== 2. 创建 12GB Swap 虚拟内存 (避开系统默认占用) ==="
          sudo dd if=/dev/zero of=/mnt/swapfile-extra bs=1M count=12288 status=progress
          sudo chmod 600 /mnt/swapfile-extra
          sudo mkswap /mnt/swapfile-extra
          sudo swapon /mnt/swapfile-extra
          free -h

      - name: 初始化编译环境 (加入 ccache 支持)
        if: steps.check.outputs.build_needed == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -y
          # 新增了 ccache 包用于缓存 C/C++ 编译过程
          sudo -E apt-get install -y dos2unix libfuse-dev jq curl git ccache
          
          curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh -o init_env.sh
          sed -i '/full-upgrade/d' init_env.sh
          sed -i '/dist-upgrade/d' init_env.sh
          sudo -E bash init_env.sh
          rm -f init_env.sh
          
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 克隆 PON 专有源码
        if: steps.check.outputs.build_needed == 'true'
        run: |
          git clone --depth=1 --single-branch --branch master https://github.com/pbs05/ponwrt.git wrt

      # ==================== 新增：利用 GitHub Cache 机制恢复缓存 ====================
      - name: 恢复缓存 (下载依赖包与 ccache)
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            wrt/dl
            wrt/.ccache
          key: ${{ runner.os }}-openwrt-${{ hashFiles('.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: 更新 Feeds 官方依赖
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 拉取专属插件 (NPU 看板与 IPTV 秒切)
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt/package
          git clone --depth=1 https://github.com/luanmuc/luci-app-airoha-npu.git
          git clone --depth=1 https://github.com/ximiTech/luci-app-msd_lite.git
          if [ ! -d "../feeds/packages/net/msd_lite" ]; then
            echo "正在补充 msd_lite 底层核心源码包..."
            git clone --depth=1 https://github.com/immortalwrt/packages.git temp_imm_pkg
            cp -r temp_imm_pkg/net/msd_lite ./
            rm -rf temp_imm_pkg
          fi

      - name: 注入配置与网口调整
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          sed -i 's/ucidef_set_interface_lan "lan1 lan2 lan3 lan4"/ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "lan4"/g' target/linux/airoha/an7581/base-files/etc/board.d/02_network || true
          sed -i 's/interrupts.*//g' target/linux/airoha/dts/an7581-nokia_xg-040g-md-common.dtsi || true

          if [ -f "$GITHUB_WORKSPACE/.config" ]; then
            echo "成功找到根目录下的 .config，正在写入配置..."
            cp -f "$GITHUB_WORKSPACE/.config" .config
          else
            echo "::error::未找到 .config 文件，请检查仓库根目录！"
            exit 1
          fi

          make defconfig
          grep -E "CONFIG_TARGET_DEVICE_|airoha-npu|msd_lite|cpufreq" .config || true

      - name: 下载依赖软件包 (结合缓存)
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          # 如果缓存命中，这一步下载会直接跳过已有的包，节约大量时间
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 开始编译固件并监控底层状态
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          (while true; do dmesg -T | grep -i -E "oom|out of memory|killed process"; sleep 10; done) &
          # ccache 配合缓存，极大提升重复编译速度
          make -j$(nproc) || make -j1 V=s

      - name: 整理打包产物 (双保险提取与防空包机制)
        id: organize
        if: steps.check.outputs.build_needed == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload_firmware"
          cd wrt

          find bin/targets/ -type f
          find bin/targets/ -type f \( -name "*.itb" -o -name "*.bin" -o -name "*.ubi" -o -name "*.fip" -o -name "*.img*" -o -name "*.tar*" \) -exec cp -f {} "$GITHUB_WORKSPACE/upload_firmware/" \;
          find bin/ -type f \( -name "*airoha-npu*" -o -name "*msd_lite*" -o -name "*cpufreq*" -o -name "*igmpproxy*" \) \( -name "*.ipk" -o -name "*.apk" \) -exec cp -f {} "$GITHUB_WORKSPACE/upload_firmware/" \;
          
          ls -lh "$GITHUB_WORKSPACE/upload_firmware/"

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/upload_firmware")" ]; then
            echo "::error::未提取到任何固件文件，请检查上方 bin/targets/ 目录输出！"
            exit 1
          fi

          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: 发布 Release
        if: steps.check.outputs.build_needed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Nokia-XG-040G-${{ env.BUILD_DATE }}
          files: ${{ github.workspace }}/upload_firmware/*
          body: |
            ### Nokia XG-040G 定制纯净转发固件
            - **编译提速**：已启用依赖包及 ccache 缓存机制
            - **底层核心**：基于 pbs05/ponwrt 源码编译 (.itb 专属版)
            - **NPU 加速**：集成 Airoha NPU (PPE) 状态看板
            - **IPTV 转流**：集成 msd_lite 与 igmpproxy
            - **硬件监控**：集成 CPU 调频与温度传感器
