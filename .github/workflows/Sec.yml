name: Build Pure Nokia XG-040G

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions: write-all

jobs:
  check-and-build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 检查上游源码更新
        id: check
        run: |
          UPSTREAM_HASH=$(curl -s "https://api.github.com/repos/pbs05/ponwrt/commits/master" | jq -r .sha)
          echo "上游最新 Commit Hash: $UPSTREAM_HASH"
          
          LOCAL_HASH=""
          if [ -f .upstream_hash ]; then
            LOCAL_HASH=$(cat .upstream_hash)
          fi
          echo "本地上次 Commit Hash: $LOCAL_HASH"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$UPSTREAM_HASH" != "$LOCAL_HASH" ]; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "$UPSTREAM_HASH" > .upstream_hash
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .upstream_hash
            git commit -m "chore: 更新上游追踪 Hash 至 $UPSTREAM_HASH" || true
            git push || true
          else
            echo "上游源码没有更新，本次跳过编译。"
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: 暴力释放磁盘空间 (防止编译因空间不足中断)
        if: steps.check.outputs.build_needed == 'true'
        run: |
          echo "清理前的磁盘空间："
          df -hT
          # 删除不需要的重型预装环境，释放超 30GB 空间
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          # 清理无用的 Docker 镜像
          sudo docker image prune --all --force
          echo "清理后的磁盘空间："
          df -hT

      - name: 初始化编译环境
        if: steps.check.outputs.build_needed == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt update -y
          sudo -E apt full-upgrade -y
          sudo -E apt install -y dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          ln -s /mnt/build_wrt wrt

      - name: 克隆 PON 专有源码
        if: steps.check.outputs.build_needed == 'true'
        run: |
          git clone --depth=1 --single-branch --branch master https://github.com/pbs05/ponwrt.git wrt

      - name: 更新 Feeds 官方依赖
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 拉取专属插件 (NPU 看板与 IPTV 秒切)
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt/package
          # 1. 达发 NPU 监控看板
          git clone --depth=1 https://github.com/luanmuc/luci-app-airoha-npu.git
          # 2. IPTV 极速转流引擎 msd_lite
          git clone --depth=1 https://github.com/ximiTech/luci-app-msd_lite.git

      - name: 注入配置与网口调整
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          # 修复 Nokia XG-040G 网口映射与 DTS 补丁
          sed -i 's/ucidef_set_interface_lan "lan1 lan2 lan3 lan4"/ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "lan4"/g' target/linux/airoha/an7581/base-files/etc/board.d/02_network || true
          sed -i 's/interrupts.*//g' target/linux/airoha/dts/an7581-nokia_xg-040g-md-common.dtsi || true

          # 使用 GitHub 绝对路径读取你根目录的 .config 文件，彻底避免路径报错
          if [ -f "$GITHUB_WORKSPACE/.config" ]; then
            echo "成功找到根目录下的 .config，正在写入配置..."
            cp -f "$GITHUB_WORKSPACE/.config" .config
          else
            echo "::error::未找到 .config 文件，请检查仓库根目录是否包含了此文件！"
            exit 1
          fi

          make defconfig

      - name: 下载依赖软件包
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          make download -j$(nproc)

      - name: 开始编译固件
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理打包产物 (双保险提取与防空包机制)
        id: organize
        if: steps.check.outputs.build_needed == 'true'
        run: |
          cd wrt
          mkdir -p upload_firmware

          echo "=== 1. 查找生成的系统镜像 ==="
          # 放宽匹配条件，只要是以 .bin, .ubi, .itb, .img, .tar 结尾的刷机包全抓走
          find bin/targets/ -type f -iregex ".*\.\(bin\|ubi\|itb\|img\|tar\)$" -exec cp -f {} upload_firmware/ \;

          echo "=== 2. 查找关键插件 IPK ==="
          # 在全局范围内把需要的 IPK 抓取到打包目录
          find bin/ -type f -name "*airoha-npu*.ipk" -exec cp -f {} upload_firmware/ \;
          find bin/ -type f -name "*msd_lite*.ipk" -exec cp -f {} upload_firmware/ \;
          find bin/ -type f -name "*cpufreq*.ipk" -exec cp -f {} upload_firmware/ \;

          echo "=== 3. 检查最终准备上传的文件列表 ==="
          ls -lh upload_firmware/

          # 如果文件夹为空，直接报错中断，防止在网页端生成一个空的 Release
          if [ -z "$(ls -A upload_firmware)" ]; then
            echo "::error::未提取到任何固件文件或插件，构建失败，请检查编译过程！"
            exit 1
          fi

          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: 发布 Release
        if: steps.check.outputs.build_needed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Nokia-XG-040G-${{ env.BUILD_DATE }}
          files: wrt/upload_firmware/*
          body: |
            ### Nokia XG-040G 定制纯净转发固件
            - **底层核心**：基于 pbs05/ponwrt 源码编译
            - **NPU 加速**：集成 Airoha NPU 看板
            - **IPTV 转流**：集成 msd_lite 与 igmpproxy
            - **硬件监控**：集成 CPU 调频与温度传感器
